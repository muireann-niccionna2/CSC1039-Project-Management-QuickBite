<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickBite – Log in</title>
  <style>
    /* ---------- Basic page look ---------- */
    body {
      font-family: Arial, sans-serif;
      background: #fdf6ee;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: white;
      width: 100%;
      max-width: 360px;
      padding: 28px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
      margin: 16px;
    }
    h1 {
      text-align: center;
      color: #d35400;
      margin: 0 0 4px;
    }
    .tagline {
      text-align: center;
      color: #777;
      margin: 0 0 20px;
    }

    /* ---------- Tabs: Log in / Sign up ---------- */
    .tabs {
      display: flex;
      margin-bottom: 20px;
    }
    .tabs button {
      flex: 1;
      padding: 10px;
      border: none;
      background: #eee;
      cursor: pointer;
      font-size: 15px;
    }
    .tabs button.active {
      background: #d35400;
      color: white;
    }

    /* ---------- Form fields ---------- */
    label {
      display: block;
      margin-top: 12px;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 10px;
      margin-top: 4px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 15px;
    }
    .submit {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      background: #d35400;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }
    .submit:hover {
      background: #b84700;
    }

    /* ---------- Messages ---------- */
    .message {
      margin-top: 14px;
      font-size: 14px;
      text-align: center;
      min-height: 18px;
    }
    .error   { color: #c0392b; }
    .success { color: #27ae60; }

    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="card">
    <h1>QuickBite</h1>
    <p class="tagline">Order ahead. Skip the queue.</p>

    <!-- Tabs to switch between the two forms -->
    <div class="tabs">
      <button id="loginTab" class="active" onclick="showForm('login')">Log in</button>
      <button id="signupTab" onclick="showForm('signup')">Sign up</button>
    </div>

    <!-- LOG IN FORM -->
    <form id="loginForm" onsubmit="logIn(event)">
      <label>Student email
        <input type="email" id="loginEmail" placeholder="name@mail.dcu.ie" required>
      </label>
      <label>Password
        <input type="password" id="loginPassword" required>
      </label>
      <button type="submit" class="submit">Log in</button>
    </form>

    <!-- SIGN UP FORM (hidden until the Sign up tab is clicked) -->
    <form id="signupForm" class="hidden" onsubmit="signUp(event)">
      <label>Full name
        <input type="text" id="signupName" required>
      </label>
      <label>Student email
        <input type="email" id="signupEmail" placeholder="name@mail.dcu.ie" required>
      </label>
      <label>Password (at least 6 characters)
        <input type="password" id="signupPassword" required>
      </label>
      <label>Confirm password
        <input type="password" id="signupConfirm" required>
      </label>
      <button type="submit" class="submit">Create account</button>
    </form>

    <p id="message" class="message"></p>
  </div>

  <script>
    // NOTE: This is a prototype for the sprint simulation.
    // Accounts are saved in the browser's localStorage, which is NOT secure
    // (passwords are stored as plain text). A real app would use a server
    // and hashed passwords. That is out of scope for this project.

    // ---------- Helpers ----------

    // Get the list of saved users (or an empty list if there are none yet)
    function getUsers() {
      try {
        return JSON.parse(localStorage.getItem("qb_users")) || [];
      } catch (e) {
        return [];
      }
    }

    // Save the list of users
    function saveUsers(users) {
      localStorage.setItem("qb_users", JSON.stringify(users));
    }

    // Show a message under the form (red for errors, green for success)
    function showMessage(text, type) {
      const msg = document.getElementById("message");
      msg.textContent = text;
      msg.className = "message " + type;
    }

    // Switch between the Log in and Sign up forms
    function showForm(which) {
      const isLogin = which === "login";
      document.getElementById("loginForm").classList.toggle("hidden", !isLogin);
      document.getElementById("signupForm").classList.toggle("hidden", isLogin);
      document.getElementById("loginTab").classList.toggle("active", isLogin);
      document.getElementById("signupTab").classList.toggle("active", !isLogin);
      showMessage("", "");
    }

    // ---------- Sign up ----------
    function signUp(event) {
      event.preventDefault(); // stop the page from reloading

      const name = document.getElementById("signupName").value.trim();
      const email = document.getElementById("signupEmail").value.trim().toLowerCase();
      const password = document.getElementById("signupPassword").value;
      const confirm = document.getElementById("signupConfirm").value;

      // Check the rules (these match the story's acceptance criteria)
      if (password.length < 6) {
        showMessage("Password must be at least 6 characters.", "error");
        return;
      }
      if (password !== confirm) {
        showMessage("Passwords do not match.", "error");
        return;
      }

      const users = getUsers();
      if (users.some(u => u.email === email)) {
        showMessage("An account with this email already exists.", "error");
        return;
      }

      users.push({ name: name, email: email, password: password });
      saveUsers(users);

      showMessage("Account created! You can now log in.", "success");
      document.getElementById("signupForm").reset();
      setTimeout(() => showForm("login"), 1200);
    }

    // ---------- Log in ----------
    function logIn(event) {
      event.preventDefault();

      const email = document.getElementById("loginEmail").value.trim().toLowerCase();
      const password = document.getElementById("loginPassword").value;

      const user = getUsers().find(u => u.email === email && u.password === password);

      if (!user) {
        showMessage("Incorrect email or password.", "error");
        return;
      }

      // Remember who is logged in, so the menu page can say "Hi, [name]"
      localStorage.setItem("qb_currentUser", JSON.stringify({ name: user.name, email: user.email }));
      showMessage("Welcome, " + user.name + "! Taking you to the menu...", "success");

      // Go to the menu page (story 1.2), which another dev is building
      setTimeout(() => { window.location.href = "menu.html"; }, 1000);
    }
  </script>

</body>
</html>
